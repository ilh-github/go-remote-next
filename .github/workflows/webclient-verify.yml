name: WebClient verify

# The macOS and Windows workflows list `WebClient/**` as a trigger path and then
# only build it, so a change to the control client could land with nothing
# running its tests. This is the gate that was missing: unit tests, the browser
# E2E that only needs a mocked API, and the E2E that needs a real signaling
# server and Redis.
#
# Split into two jobs on purpose. The unit and mocked-browser tests are the ones
# a contributor waits on, so they run without a database or a browser download.
# The server-backed E2E needs Go, Redis and a browser, and is the slower half.
on:
  push:
    paths:
      - 'WebClient/**'
      - 'SignalingServer/**'
      - '.github/workflows/webclient-verify.yml'
  pull_request:
    paths:
      - 'WebClient/**'
      - 'SignalingServer/**'
      - '.github/workflows/webclient-verify.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: Unit tests and mocked-browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: WebClient
        # `npm install`, not `npm ci`: the lock file is not committed. The
        # repository's .gitignore has a bare `package-lock.json` rule with no
        # leading slash, so it matches at every depth - including WebClient's -
        # and the first run of this workflow failed on exactly that, with
        # setup-node reporting "specified paths were not resolved". Committing a
        # lock file would mean editing a rule somebody else set for the whole
        # repository, which is not this change's to make.
        run: npm install
      - name: Unit tests
        working-directory: WebClient
        run: npm test
      - name: Install the browser the E2E drive
        working-directory: WebClient
        # Playwright's bundled Chromium rather than a system Chrome: the tests
        # take their channel from QD_BROWSER_CHANNEL, and leaving it unset here
        # means "whatever Playwright installed", which is reproducible.
        run: npx playwright install --with-deps chromium
      # Every E2E here serves a mocked API, so none of them needs the signaling
      # server or Redis.
      #
      # Through the runner rather than a hand-written list: this list was the
      # reason three audit E2E files stayed red for days. The unit tests and the
      # server were updated together, these were not, and nothing ran them as a
      # set - a file with no line in this list was a file nobody ran. The runner
      # discovers test/e2e/ so a new file is covered the day it lands, and skips
      # the long soak explicitly rather than by omission.
      - name: Mocked-browser E2E
        working-directory: WebClient
        run: npm run test:e2e

  integration:
    name: Server-backed E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: SignalingServer/go.mod
          cache-dependency-path: SignalingServer/go.sum
      - name: Warm the Go module cache
        working-directory: SignalingServer
        # The E2E shell out to `go build` with a bounded output buffer. On a cold
        # runner that build downloads the whole module graph, the output overflows
        # the buffer, and the test fails with "Command failed" before it has
        # asserted anything. Downloading here keeps the build quiet and the
        # failure mode honest.
        run: go mod download
      - name: Satisfy the embedded admin UI
        working-directory: SignalingServer
        # `//go:embed web/dist/*` needs at least one matching file, and web/dist
        # is a build artifact the repository does not carry. The same two lines
        # appear in signaling-server-verify.yml for the same reason. A placeholder
        # is enough: these E2E exercise the API, not the admin SPA, and building
        # the real one here would mean running the WebClient build inside a job
        # whose point is to test the WebClient.
        run: |
          mkdir -p web/dist
          printf '<!doctype html><title>ci placeholder</title>\n' > web/dist/index.html
      - name: Install dependencies
        working-directory: WebClient
        run: npm install
      - name: Build the client
        working-directory: WebClient
        # `control-mode.e2e.mjs` serves `dist/` rather than a Vite dev server, so
        # it exercises the artifact that ships instead of the source. That is the
        # point of it, which is why the build belongs here rather than being
        # swapped for a dev server.
        run: npm run build
      - name: Install the browser the E2E drive
        working-directory: WebClient
        run: npx playwright install --with-deps chromium
      - name: Install redis-server
        # These tests spawn their own `redis-server` on a free port rather than
        # reading a service's host and port, so the service container is no use
        # here - the runner needs the binary itself.
        run: sudo apt-get update && sudo apt-get install -y redis-server
      # These build and boot a real signaling server over a real Redis, so they
      # are the ones that catch a contract drift between the client and the
      # server - the failure mode a mocked API cannot see.
      #
      # The runner, for the same reason as the mocked job: a hand-written list is
      # a file that can be forgotten. These are the files that need the server,
      # so the filter names them rather than excluding anything - a new
      # server-backed file still has to be added here, but now it fails loudly as
      # "not run" instead of silently.
      - name: Server-backed E2E
        working-directory: WebClient
        run: |
          node scripts/run-e2e.mjs --filter audit-log-client
          node scripts/run-e2e.mjs --filter clipboard-audit
          node scripts/run-e2e.mjs --filter owner-audit
          node scripts/run-e2e.mjs --filter control
          node scripts/run-e2e.mjs --filter selfhost
