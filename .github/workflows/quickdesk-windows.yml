name: QuickDesk Windows

on:
  push:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-windows.yml'
  pull_request:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: windows-2022
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        shell: bash
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Detect VS environment
        shell: pwsh
        run: |
          $vs_install = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          echo "ENV_VS_INSTALL=$vs_install" >> $env:GITHUB_ENV

          $redist_root = Join-Path $vs_install "VC\Redist\MSVC"
          $latest = Get-ChildItem $redist_root -Directory |
            Where-Object { $_.Name -match '^\d+\.' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          echo "ENV_VCRUNTIME_VERSION=$($latest.Name)" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quickdesk-mcp/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('quickdesk-mcp/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        shell: cmd
        env:
          ENV_QUICKDESK_API_KEY: ${{ secrets.QUICKDESK_API_KEY }}
        run: call scripts\build_qd_win.bat Release

      - name: Build MCP Bridge
        shell: cmd
        run: call scripts\build_mcp_win.bat Release

      # The MCP bridge is built here and nowhere tested, which is how a module
      # can carry a hundred passing tests and still have no evidence from any
      # runner. `cargo build` compiles the test module only under `cfg(test)`,
      # so a build says nothing about whether those tests pass - or whether
      # they still compile after a refactor.
      - name: Test MCP Bridge
        shell: cmd
        run: |
          cd quickdesk-mcp
          cargo test --offline
          if errorlevel 1 exit /b 1
          cargo clippy --offline --all-targets -- -D warnings
          if errorlevel 1 exit /b 1

      - name: Build Skill Host
        shell: cmd
        run: call scripts\build_skill_host_win.bat Release

      - name: Build WebClient
        shell: cmd
        run: call scripts\build_webclient_win.bat

      - name: Publish
        shell: cmd
        run: call scripts\publish_qd_win.bat Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer
        shell: cmd
        run: call scripts\package_qd_win.bat Release

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "ref-name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDesk-win-x64-${{ steps.version.outputs.ref-name }}
          path: publish/QuickDesk-win-x64-setup.exe

      - name: Upload WebClient artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDesk-WebClient-${{ steps.version.outputs.ref-name }}
          path: WebClient/dist/

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: publish/QuickDesk-win-x64-setup.exe
          asset_name: QuickDesk-win-x64-${{ steps.version.outputs.ref-name }}-setup.exe
          tag: ${{ github.ref }}
          overwrite: true

      - name: Package WebClient
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path WebClient/dist/* -DestinationPath publish/QuickDesk-WebClient.zip

      - name: Upload WebClient to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: publish/QuickDesk-WebClient.zip
          asset_name: QuickDesk-WebClient-${{ steps.version.outputs.ref-name }}.zip
          tag: ${{ github.ref }}
          overwrite: true

  # Same reason as the macOS one: QUICKDESK_BUILD_TESTS defaults to OFF and the
  # release scripts leave it off, so nothing ran the unit tests. Windows matters
  # more here, because the trust-handler and host-readiness work is Windows-side.
  test:
    name: Unit tests
    runs-on: windows-2022
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        shell: bash
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure with tests enabled
        shell: bash
        run: |
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUICKDESK_BUILD_TESTS=ON

      - name: Build and run the test suite
        shell: bash
        run: |
          cmake --build build-tests --parallel
          # -C is required, not optional. The default generator here is Visual
          # Studio, which is multi-config, and ctest without a configuration
          # cannot resolve the test executables: every test comes back
          # "***Not Run - Test not available without configuration". The job
          # then fails having asserted nothing at all.
          cd build-tests && ctest -C Release --output-on-failure

      # Docker is not available on the Windows runner, so the container check
      # runs on macOS instead; this job covers the Qt-linked targets.
      - name: Verify the Windows release guard
        shell: pwsh
        run: pwsh -NoProfile -File scripts/e2e/test-qd215-qt-version-agreement.ps1

      - name: Check no source file is test-only
        shell: bash
        run: bash scripts/e2e/test-quickdesk-cmake-source-coverage.sh
