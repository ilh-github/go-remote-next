name: QuickDesk macOS

on:
  push:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-macos.yml'
  pull_request:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      # Without this, one arch's failure cancels the other. The x64 build fails
      # at Package DMG for want of signing credentials, which has nothing to do
      # with the arm64 build, and cancelling it throws away evidence that was
      # already earned.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-14
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quickdesk-mcp/target
            quickdesk-skill-host/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('quickdesk-mcp/Cargo.lock', 'quickdesk-skill-host/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build
        env:
          ENV_QUICKDESK_API_KEY: ${{ secrets.QUICKDESK_API_KEY }}
        run: bash scripts/build_qd_mac.sh Release ${{ matrix.arch }}

      - name: Build MCP Bridge
        run: bash scripts/build_mcp_mac.sh Release ${{ matrix.arch }}

      # Same gap as the Windows workflow: the bridge is built and never tested,
      # so its test module only ever runs on a developer's machine.
      - name: Test MCP Bridge
        run: |
          cd quickdesk-mcp
          cargo test --offline
          cargo clippy --offline --all-targets -- -D warnings

      - name: Build Skill Host
        run: bash scripts/build_skill_host_mac.sh Release ${{ matrix.arch }}

      # file-ops deletes things on a remote machine and its trash logic is where
      # a mistake destroys data. Its tests only compile under cfg(test), so the
      # build above says nothing about them.
      - name: Test Skill Host
        run: |
          cd quickdesk-skill-host
          cargo test --offline

      - name: Build WebClient
        run: bash scripts/build_webclient_mac.sh

      - name: Publish
        run: bash scripts/publish_qd_mac.sh Release ${{ matrix.arch }}

      - name: Package DMG
        run: bash scripts/package_qd_mac.sh Release

      # Both gates run before anything is uploaded. The notarization gate is
      # what stops a signed-but-unnotarized DMG from reaching a release, and
      # the update-helper gate is what stops the updater from installing one:
      # the same defect on the other side of the handoff, which no test covered
      # until now.
      - name: Notarization gate E2E
        run: bash scripts/e2e/test-quickdesk-macos-notarize-gate.sh

      - name: Update helper E2E
        run: bash scripts/e2e/test-quickdesk-macos-update-helper.sh

      - name: Get version
        id: version
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "ref-name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDesk-mac-${{ matrix.arch }}-${{ steps.version.outputs.ref-name }}
          path: publish/Release/QuickDesk.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: publish/Release/QuickDesk.dmg
          asset_name: QuickDesk-mac-${{ matrix.arch }}-${{ steps.version.outputs.ref-name }}.dmg
          tag: ${{ github.ref }}
          overwrite: true

  # The unit tests are behind QUICKDESK_BUILD_TESTS, which the release scripts
  # deliberately leave off, so nothing in this workflow ran them - including the
  # CTest set that came in with the upstream trust-handler merge. This job is the
  # only path that turns them on. It does not package or upload anything, so a
  # test failure cannot hold back a release artifact.
  test:
    name: Unit tests (arm64)
    runs-on: macos-14
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure with tests enabled
        run: |
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUICKDESK_BUILD_TESTS=ON

      - name: Build and run the test suite
        run: |
          cmake --build build-tests --parallel
          # The value is not decorative: with a multi-config generator, ctest
          # without -C resolves no test executable and every test is reported
          # "***Not Run", which fails the job without testing anything. Passing
          # the configuration that was just built is what makes the run real.
          # Single-config generators ignore the flag, so this stays correct on
          # both shapes.
          cd build-tests && ctest -C Release --output-on-failure

      # Being in the build tree is a separate fact from the suite passing: the
      # trust-handler CTest sat in test/trust/ with nothing pointing at it, so
      # the 16/16 green run did not include it.
      - name: Verify the trust-handler CTest is wired in
        run: bash scripts/e2e/test-quickdesk-trust-test-wiring.sh

      # The two cmake checks below need an environment that has cmake and a
      # compiler but no Qt, which only a container provides. Neither hosted
      # runner has Docker - not Windows, and not this one, where they ran for
      # twelve rounds and failed every time with "docker: command not found"
      # while the job was assumed to be covering them.
      #
      # They are deliberately not wired in here. Running them in a tree that has
      # Qt on the path would change what they prove, and a green tick for a
      # check that could not run is worse than no tick. Both now skip loudly
      # when Docker is absent, so wiring them back in somewhere is safe and
      # honest. Run them by hand, or in a job with a container.
      #   scripts/e2e/test-quickdesk-cmake-test-targets.sh
      #   scripts/e2e/test-quickdesk-cmake-ctest-config.sh

      # A source file that only the test target compiles links nothing into the
      # app, which is how recordinglifecycle.cpp broke the x64 build.
      - name: Check no source file is test-only
        run: bash scripts/e2e/test-quickdesk-cmake-source-coverage.sh

      # The mirror of the above for the tests directory, where a .cpp that no
      # target compiles is invisible: nothing else in the tree would try to build
      # it, so it reads as coverage while asserting nothing.
      - name: Check every test source file is built
        run: bash scripts/e2e/test-quickdesk-tests-source-coverage.sh
