name: QuickDesk macOS

on:
  push:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-macos.yml'
  pull_request:
    paths:
      - 'QuickDesk/**'
      - 'quickdesk-mcp/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'WebClient/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quickdesk-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-14
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quickdesk-mcp/target
            quickdesk-skill-host/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('quickdesk-mcp/Cargo.lock', 'quickdesk-skill-host/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build
        env:
          ENV_QUICKDESK_API_KEY: ${{ secrets.QUICKDESK_API_KEY }}
        run: bash scripts/build_qd_mac.sh Release ${{ matrix.arch }}

      - name: Build MCP Bridge
        run: bash scripts/build_mcp_mac.sh Release ${{ matrix.arch }}

      - name: Build Skill Host
        run: bash scripts/build_skill_host_mac.sh Release ${{ matrix.arch }}

      - name: Build WebClient
        run: bash scripts/build_webclient_mac.sh

      - name: Publish
        run: bash scripts/publish_qd_mac.sh Release ${{ matrix.arch }}

      - name: Package DMG
        run: bash scripts/package_qd_mac.sh Release

      # Both gates run before anything is uploaded. The notarization gate is
      # what stops a signed-but-unnotarized DMG from reaching a release, and
      # the update-helper gate is what stops the updater from installing one:
      # the same defect on the other side of the handoff, which no test covered
      # until now.
      - name: Notarization gate E2E
        run: bash scripts/e2e/test-quickdesk-macos-notarize-gate.sh

      - name: Update helper E2E
        run: bash scripts/e2e/test-quickdesk-macos-update-helper.sh

      - name: Get version
        id: version
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "ref-name=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDesk-mac-${{ matrix.arch }}-${{ steps.version.outputs.ref-name }}
          path: publish/Release/QuickDesk.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: publish/Release/QuickDesk.dmg
          asset_name: QuickDesk-mac-${{ matrix.arch }}-${{ steps.version.outputs.ref-name }}.dmg
          tag: ${{ github.ref }}
          overwrite: true

  # The unit tests are behind QUICKDESK_BUILD_TESTS, which the release scripts
  # deliberately leave off, so nothing in this workflow ran them - including the
  # CTest set that came in with the upstream trust-handler merge. This job is the
  # only path that turns them on. It does not package or upload anything, so a
  # test failure cannot hold back a release artifact.
  test:
    name: Unit tests (arm64)
    runs-on: macos-14
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: 'qtmultimedia qtwebsockets'

      - name: Set Qt path
        run: echo "ENV_QT_PATH=$(dirname "$QT_ROOT_DIR")" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure with tests enabled
        run: |
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUICKDESK_BUILD_TESTS=ON

      - name: Build and run the test suite
        run: |
          cmake --build build-tests --parallel
          cd build-tests && ctest --output-on-failure

      # The targets that need nothing beyond the standard library are checked
      # here too, in a container that has cmake but no Qt, so a mistake in their
      # CMake definitions is caught even where the full suite cannot configure.
      - name: Verify the non-Qt cmake test targets
        run: bash scripts/e2e/test-quickdesk-cmake-test-targets.sh
