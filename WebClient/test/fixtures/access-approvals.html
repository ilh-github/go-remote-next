<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Access Approvals E2E</title>
  <style>
    body { margin: 0; padding: 20px; background: #1a1a2e; color: #eee; font-family: sans-serif; }
    .card { margin-bottom: 16px; padding: 16px; background: #1e2a4a; }
    .summary-strip { display: flex; gap: 12px; }
    .summary-cell { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; background: rgba(255,255,255,.06); }
    .summary-detail-row { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .approval-list { display: flex; flex-direction: column; gap: 12px; }
    .approval-item { padding: 14px; background: rgba(255,255,255,.05); }
    .approval-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .approval-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; }
    .approval-actions { display: flex; gap: 8px; margin-top: 12px; }
    .reason-line { margin-top: 8px; font-size: 13px; }
    .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); padding: 24px; display: flex; align-items: flex-start; justify-content: center; }
    .dialog { width: 520px; margin-top: 40px; padding: 22px; background: #1e2a4a; }
    .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .dialog-grid { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; font-size: 13px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .form-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn { padding: 6px 12px; border: 0; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: #4f7cff; color: #fff; }
    .btn-danger { background: #e05252; color: #fff; }
    .btn-secondary { background: rgba(255,255,255,.14); color: #eee; }
    .btn-sm { padding: 4px 10px; font-size: 13px; }
    .deny-warning { margin: 10px 0 0; font-size: 13px; color: #ffcf6b; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createApp, h } from 'vue'
    import { createI18n } from 'vue-i18n'
    import AccessApprovalsPage from '/src/views/AccessApprovalsPage.vue'
    import { en } from '/src/i18n/en.js'
    import { zh } from '/src/i18n/zh.js'
    import { userApi } from '/src/api/userApi.js'
    import { authState, updateAuthState } from '/src/store/auth.js'

    localStorage.setItem('quickdesk_signaling_url', location.origin.replace(/^http/, 'ws'))
    localStorage.setItem('quickdesk_lang', 'en-US')
    userApi.setBaseUrl(location.origin)
    updateAuthState()

    const i18n = createI18n({
      legacy: false,
      locale: 'en-US',
      fallbackLocale: 'en-US',
      messages: { 'zh-CN': zh, 'en-US': en },
    })
    const app = createApp({
      render: () => h(AccessApprovalsPage),
    })
    app.use(i18n)
    app.provide('showToast', (message, type) => {
      window.__approvalToasts.push({ message, type })
    })
    app.provide('showLogin', () => {
      window.__showLoginCalls += 1
    })
    app.provide('authState', authState)

    window.__approvalToasts = []
    window.__showLoginCalls = 0
    app.mount('#app')
    window.__approvalsMounted = true
  </script>
</body>
</html>
